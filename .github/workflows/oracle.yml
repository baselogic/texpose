name: Canonical oracle

on:
  pull_request:
    paths:
      - Cargo.toml
      - src/**
      - data/**
      - golds/**
      - tests/**
      - tools/**
      - docs/ORACLE_PROFILES.md
      - .github/workflows/oracle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    name: canonical oracle / MiKTeX 26.5
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, texpose-oracle-miktex-26-5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Oracle self-test
        shell: pwsh
        run: uv run --script tools\verify.py self-test
      - name: Canonical profiles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\oracle | Out-Null
          $failed = $false
          foreach ($profile in @("stix", "libertinus", "fira")) {
            uv run --script tools\verify.py math --profile $profile --fail-on-delta --evidence-json "artifacts\oracle\$profile-canonical.json"
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }
      - name: Upload canonical oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-oracle-evidence
          path: artifacts/oracle
          if-no-files-found: warn
