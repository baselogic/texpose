name: Oracle hosted probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: hosted Windows pinned oracle probe
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv

      - name: Install MiKTeX
        shell: pwsh
        run: |
          choco install miktex --no-progress --params "/Set:basic" -y
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv
          $lua = Get-ChildItem "C:\Program Files\MiKTeX" -Recurse -Filter lualatex.exe -ErrorAction Stop |
            Select-Object -First 1
          if (-not $lua) {
            throw "lualatex.exe not found after MiKTeX install"
          }
          $lua.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          & $lua.FullName --version

      - name: Enable package installation
        shell: pwsh
        run: |
          initexmf --admin --enable-installer
          miktex --admin fndb refresh

      - name: Pin fontspec 2.9g
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "fontspec-2.9g"
          git init $root
          git -C $root remote add origin https://github.com/latex3/fontspec.git
          git -C $root fetch --depth 1 origin 33c461f97152295fe50139daae458a023ff5050c
          git -C $root checkout --detach FETCH_HEAD
          Push-Location $root
          lualatex -interaction=nonstopmode -halt-on-error fontspec.ins
          Pop-Location
          foreach ($file in @("fontspec.sty", "fontspec-luatex.sty", "fontspec-xetex.sty", "fontspec.lua")) {
            if (-not (Test-Path (Join-Path $root $file))) {
              throw "pinned fontspec generation did not produce $file"
            }
          }
          $env:TEXINPUTS = "$root;$env:TEXINPUTS"
          $env:LUAINPUTS = "$root;$env:LUAINPUTS"
          "TEXINPUTS=$env:TEXINPUTS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LUAINPUTS=$env:LUAINPUTS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $resolved = kpsewhich fontspec.sty
          Write-Host "fontspec.sty=$resolved"
          if (-not $resolved.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "pinned fontspec is not first on the TeX search path"
          }

      - name: Probe pinned STIX environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\probe | Out-Null
          uv run --script tools\verify.py math --profile stix --fail-on-delta --evidence-json artifacts\probe\stix.json

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-oracle-probe
          path: artifacts/probe
          if-no-files-found: warn
