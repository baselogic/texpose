[package]
name = "texpose"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
publish = false
license = "MIT OR Apache-2.0"
description = "Portable Rust engine for TeX/LaTeX mathematical notation parsing and layout."
readme = "README.md"
repository = "https://github.com/baselogic/texpose"
homepage = "https://github.com/baselogic/texpose"
documentation = "https://docs.rs/texpose"
keywords = ["latex", "tex", "math", "typesetting", "rust"]
categories = ["rendering", "science", "mathematics"]
include = [
    "src/**",
    "data/**",
    "golds/**",
    "tests/**",
    "benches/layout.rs",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "NOTICE",
]

[features]
default = []
stix-two-math = []

[dependencies]
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }

[[bench]]
name = "layout"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
