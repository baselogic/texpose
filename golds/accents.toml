# Gold tests — Milestone 6 accents and decorations
# Contract: deterministic TeXpose regression values. Do not edit golds to hide a bug.
# `expect` for kind=dims is MathBox::dim_gold() on the pinned STIX Two Math fixture.
# External TeX compatibility requires the applicable specification plus independent oracle evidence.

[[gold]]
name = "hat-x-ast"
kind = "ast"
input = "\\hat{x}"
expect = "(accent hat (atom Ord \"x\"))"

